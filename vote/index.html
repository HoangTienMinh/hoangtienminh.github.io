<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đại Chiến Vote: Ngọc Anh vs Hoàng Minh</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1f4068, #162447, #1b1b2f);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #e43f5a;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #a7a9be;
            margin-bottom: 40px;
        }

        .battle-arena {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
        }

        .fighter-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 30px;
            width: 300px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .fighter-card:hover {
            transform: translateY(-5px);
            border-color: #e43f5a;
            box-shadow: 0 10px 20px rgba(228, 63, 90, 0.3);
        }

        .fighter-name {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .vote-count {
            font-size: 2.2rem;
            font-weight: bold;
            color: #00adb5;
            margin-bottom: 20px;
        }

        .btn-vote {
            background: #e43f5a;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-transform: uppercase;
        }

        .btn-vote:hover {
            background: #d6304f;
        }

        .btn-vote:active {
            transform: scale(0.95);
        }

        .vs-text {
            font-size: 2rem;
            font-weight: bold;
            font-style: italic;
            color: #ffcc00;
        }

        .progress-container {
            width: 100%;
            background-color: #2b2d42;
            border-radius: 15px;
            height: 25px;
            overflow: hidden;
            display: flex;
            margin-bottom: 20px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
        }

        .progress-bar-left {
            height: 100%;
            background-color: #e43f5a;
            width: 50%;
            transition: width 0.4s ease;
        }

        .progress-bar-right {
            height: 100%;
            background-color: #00adb5;
            width: 50%;
            transition: width 0.4s ease;
        }

        .stats-info {
            display: flex;
            justify-content: space-between;
            color: #a7a9be;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .battle-arena {
                flex-direction: column;
            }
            .vs-text {
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Đại Chiến Vote</h1>
        <p class="subtitle">Ai sẽ là người chiến thắng trong trận đấu này?</p>

        <!-- Thanh tỉ lệ % -->
        <div class="progress-container">
            <div class="progress-bar-left" id="barLeft"></div>
            <div class="progress-bar-right" id="barRight"></div>
        </div>
        <div class="stats-info">
            <span id="percentLeft">50%</span>
            <span>TỈ LỆ BÌNH CHỌN</span>
            <span id="percentRight">50%</span>
        </div>

        <!-- Khu vực 2 bên -->
        <div class="battle-arena">
            <!-- Ngọc Anh -->
            <div class="fighter-card">
                <div class="fighter-name" style="color: #e43f5a;">Ngọc Anh</div>
                <div class="vote-count" id="countA">1250</div>
                <button class="btn-vote" onclick="vote('A')">Vote Ngay</button>
            </div>

            <div class="vs-text">VS</div>

            <!-- Hoàng Minh -->
            <div class="fighter-card">
                <div class="fighter-name" style="color: #00adb5;">Hoàng Minh</div>
                <div class="vote-count" id="countB">1280</div>
                <button class="btn-vote" onclick="vote('B')">Vote Ngay</button>
            </div>
        </div>
    </div>

    <script>
        // Khởi tạo số lượng vote ban đầu
        let votesA = 1250;
        let votesB = 1280;

        const countAEl = document.getElementById('countA');
        const countBEl = document.getElementById('countB');
        const barLeft = document.getElementById('barLeft');
        const barRight = document.getElementById('barRight');
        const percentLeft = document.getElementById('percentLeft');
        const percentRight = document.getElementById('percentRight');

        function updateDisplay() {
            countAEl.innerText = votesA.toLocaleString();
            countBEl.innerText = votesB.toLocaleString();

            let total = votesA + votesB;
            let pA = total > 0 ? ((votesA / total) * 100).toFixed(1) : 50;
            let pB = total > 0 ? (100 - pA).toFixed(1) : 50;

            barLeft.style.width = pA + '%';
            barRight.style.width = pB + '%';
            percentLeft.innerText = pA + '%';
            percentRight.innerText = pB + '%';
        }

        // Khi người dùng bấm nút vote
        function vote(fighter) {
            if (fighter === 'A') {
                votesA += Math.floor(Math.random() * 5) + 1; // Tăng ngẫu nhiên 1-5 vote khi click
            } else {
                votesB += Math.floor(Math.random() * 5) + 1;
            }
            updateDisplay();
        }

        // Tự động tăng số lượng vote theo thời gian (mỗi 2-4 giây)
        setInterval(() => {
            // Random xem bên nào được cộng điểm tự động (hoặc tăng đều cả hai)
            let randomSide = Math.random();
            if (randomSide > 0.4) {
                votesA += Math.floor(Math.random() * 3) + 1;
            }
            if (randomSide < 0.6) {
                votesB += Math.floor(Math.random() * 3) + 1;
            }
            updateDisplay();
        }, 2500); // 2.5 giây tăng một lần

        // Chạy lần đầu
        updateDisplay();
    </script>
</body>
</html>
