<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mô Hình 3D Trái Đất | HoangTienMinh</title>
  <link rel="icon" type="image/png" sizes="32x32" href="https://cdn.upanhlaylink.com/i/4JC52r6S.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background-color: #03050a;
      color: #f4f7fb;
      font-family: 'Be Vietnam Pro', Arial, sans-serif;
      user-select: none;
    }

    #canvas-wrap {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    .hud-header {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: calc(100% - 32px);
      max-width: 760px;
      text-align: center;
      pointer-events: none;
      padding: 8px 16px;
      animation: fadeDown 0.7s ease both;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      font-weight: 500;
      color: #cbd5e1;
      background: rgba(10, 15, 26, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      animation: pulseDot 2.4s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    .spectral-title {
      font-size: clamp(1.25rem, 3.1vw, 1.9rem);
      font-weight: 700;
      letter-spacing: 0.5px;
      line-height: 1.3;
      background: linear-gradient(90deg, #7dd3fc, #38ef7d, #f0abfc, #7dd3fc);
      background-size: 320% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: spectralShift 15s linear infinite;
      filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.2));
    }

    @keyframes spectralShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .celestial-controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .celestial-btn {
      background: rgba(10, 15, 26, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #cbd5e1;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .celestial-btn:hover {
      border-color: rgba(125, 211, 252, 0.55);
      color: #ffffff;
      background: rgba(30, 41, 59, 0.88);
    }

    .celestial-btn.active-sun {
      border-color: rgba(253, 224, 71, 0.8);
      color: #fde047;
      background: rgba(120, 53, 15, 0.42);
      box-shadow: 0 0 16px rgba(250, 204, 21, 0.28);
    }

    .celestial-btn.active-moon {
      border-color: rgba(125, 211, 252, 0.8);
      color: #7dd3fc;
      background: rgba(12, 74, 110, 0.42);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.28);
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translate(-50%, -12px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    @media (max-width: 600px) {
      .hud-header {
        top: 12px;
        padding: 6px 10px;
      }

      .celestial-controls {
        bottom: 14px;
        gap: 8px;
      }

      .celestial-btn {
        font-size: 0.76rem;
        padding: 7px 13px;
      }
    }
  </style>
</head>
<body>
  <header class="hud-header">
    <div class="status-pill">
      <span class="status-dot"></span>
      <span>HoangTienMinh • 3D Model Of The Earth</span>
    </div>
    <h1 class="spectral-title">Mô Hình 3D Trái Đất</h1>
  </header>

  <div id="canvas-wrap"></div>

  <div class="celestial-controls">
    <button type="button" class="celestial-btn" id="toggle-sun">☀️ Mặt Trời: Tắt</button>
    <button type="button" class="celestial-btn" id="toggle-moon">🌙 Mặt Trăng: Tắt</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    const wrap = document.getElementById("canvas-wrap");
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 3000);
    const earthOnlyCamPos = new THREE.Vector3(0, 0.22, 2.95);
    const moonOnlyCamPos = new THREE.Vector3(0, 1.35, 6.8);
    const sunSystemCamPos = new THREE.Vector3(-1.4, 2.2, 9.6);
    camera.position.copy(earthOnlyCamPos);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    wrap.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 1.35;
    controls.maxDistance = 48;
    controls.rotateSpeed = 0.75;
    controls.zoomSpeed = 0.85;

    // ================= HỆ THỐNG ÁNH SÁNG =================
    // 1. Chế độ quan sát toàn cảnh (khi tắt Mặt Trời):
    // Dùng nguồn sáng định hướng đi theo góc nhìn của camera (cameraStudioLight) + ambient nhẹ.
    // Nhờ có ánh sáng định hướng theo camera, bề mặt Trái Đất giữ trọn độ bóng đại dương (specular),
    // độ nổi khối lục địa (bump) và độ sâu 3D y hệt khi bật Mặt Trời, nhưng xoay góc nào cũng sáng đẹp,
    // không bị chia nửa tối nửa sáng.
    const baseAmbient = new THREE.AmbientLight(0xdbeafe, 0.38);
    scene.add(baseAmbient);

    const cameraStudioLight = new THREE.DirectionalLight(0xfffaf0, 1.75);
    scene.add(cameraStudioLight);

    // 2. Chế độ Mặt Trời (khi bật Mặt Trời):
    // Tắt cameraStudioLight, kích hoạt ánh sáng Mặt Trời thực tế để tạo ranh giới ngày - đêm.
    const sunPosition = new THREE.Vector3(46, 7.5, 20);
    const sunLight = new THREE.DirectionalLight(0xfff6e0, 0);
    sunLight.position.copy(sunPosition);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 5;
    sunLight.shadow.camera.far = 120;
    const shadowBound = 16;
    sunLight.shadow.camera.left = -shadowBound;
    sunLight.shadow.camera.right = shadowBound;
    sunLight.shadow.camera.top = shadowBound;
    sunLight.shadow.camera.bottom = -shadowBound;
    sunLight.shadow.bias = -0.0004;
    scene.add(sunLight);

    // Ánh sáng bạc phản chiếu từ Mặt Trăng hắt nhẹ lên Trái Đất
    const moonBounceLight = new THREE.PointLight(0xdbeafe, 0, 24, 1.5);
    scene.add(moonBounceLight);

    // ================= MẶT TRỜI (SHADER QUANG CẦU + NHẬT HOA + TIA SÁNG) =================
    const sunGroup = new THREE.Group();
    sunGroup.position.copy(sunPosition);
    sunGroup.visible = false;
    scene.add(sunGroup);

    const sunSurfaceMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 }
      },
      vertexShader: `
        varying vec3 vNormal;
        varying vec3 vPos;
        void main() {
          vNormal = normalize(normalMatrix * normal);
          vPos = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        varying vec3 vNormal;
        varying vec3 vPos;

        float hash(vec3 p) {
          p = fract(p * 0.3183099 + 0.1);
          p *= 17.0;
          return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
        }

        float noise(vec3 x) {
          vec3 i = floor(x);
          vec3 f = fract(x);
          f = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
                mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
            mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y),
            f.z
          );
        }

        float fbm(vec3 p) {
          float v = 0.0;
          float a = 0.5;
          for (int i = 0; i < 5; i++) {
            v += a * noise(p);
            p = p * 2.1 + vec3(0.12, -0.08, 0.15);
            a *= 0.5;
          }
          return v;
        }

        void main() {
          vec3 q = vPos * 4.2 + vec3(uTime * 0.14, -uTime * 0.1, uTime * 0.12);
          float n1 = fbm(q);
          float n2 = fbm(q * 2.3 - vec3(uTime * 0.2));
          float plasma = clamp(n1 * 0.65 + n2 * 0.45, 0.0, 1.0);

          float viewDot = clamp(dot(normalize(vNormal), vec3(0.0, 0.0, 1.0)), 0.0, 1.0);
          float limb = pow(viewDot, 0.42);

          vec3 deepOrange = vec3(0.95, 0.34, 0.04);
          vec3 brightGold = vec3(1.0, 0.78, 0.22);
          vec3 coreWhite = vec3(1.0, 0.98, 0.88);

          vec3 col = mix(deepOrange, brightGold, smoothstep(0.25, 0.65, plasma));
          col = mix(col, coreWhite, smoothstep(0.62, 0.92, plasma));
          col *= (0.45 + 0.75 * limb);

          gl_FragColor = vec4(col * 1.35, 1.0);
        }
      `
    });

    const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(1.55, 64, 64), sunSurfaceMaterial);
    sunGroup.add(sunMesh);

    const sunRimMesh = new THREE.Mesh(
      new THREE.SphereGeometry(1.64, 64, 64),
      new THREE.ShaderMaterial({
        vertexShader: `
          varying vec3 vNormal;
          void main() {
            vNormal = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec3 vNormal;
          void main() {
            float rim = pow(clamp(0.7 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 0.0, 1.0), 3.4);
            gl_FragColor = vec4(1.0, 0.55, 0.12, 1.0) * rim * 1.45;
          }
        `,
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending,
        transparent: true,
        depthWrite: false
      })
    );
    sunGroup.add(sunRimMesh);

    function createRealisticCoronaTexture() {
      const c = document.createElement("canvas");
      c.width = 512;
      c.height = 512;
      const g = c.getContext("2d");
      const cx = 256, cy = 256;

      const grad = g.createRadialGradient(cx, cy, 24, cx, cy, 256);
      grad.addColorStop(0, "rgba(255, 250, 224, 0.95)");
      grad.addColorStop(0.16, "rgba(255, 214, 102, 0.55)");
      grad.addColorStop(0.38, "rgba(251, 146, 60, 0.2)");
      grad.addColorStop(0.7, "rgba(234, 88, 12, 0.05)");
      grad.addColorStop(1, "rgba(234, 88, 12, 0)");
      g.fillStyle = grad;
      g.fillRect(0, 0, 512, 512);

      g.save();
      g.translate(cx, cy);
      for (let i = 0; i < 24; i++) {
        const angle = (i / 24) * Math.PI * 2 + (i % 3) * 0.07;
        const len = 150 + (i % 5) * 22;
        g.save();
        g.rotate(angle);
        const rayGrad = g.createLinearGradient(0, 0, len, 0);
        rayGrad.addColorStop(0, "rgba(255, 245, 200, 0.24)");
        rayGrad.addColorStop(0.45, "rgba(253, 186, 116, 0.08)");
        rayGrad.addColorStop(1, "rgba(253, 186, 116, 0)");
        g.fillStyle = rayGrad;
        g.beginPath();
        g.moveTo(0, -2.2);
        g.lineTo(len, 0);
        g.lineTo(0, 2.2);
        g.closePath();
        g.fill();
        g.restore();
      }
      g.restore();

      return new THREE.CanvasTexture(c);
    }

    const sunCorona = new THREE.Sprite(
      new THREE.SpriteMaterial({
        map: createRealisticCoronaTexture(),
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      })
    );
    sunCorona.scale.set(9.8, 9.8, 1);
    sunGroup.add(sunCorona);

    // ================= TRÁI ĐẤT (BỀ MẶT + ĐÈN ĐÔ THỊ + MÂY + KHÍ QUYỂN) =================
    const textureLoader = new THREE.TextureLoader();
    const baseUrl = "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/";

    const earthTexture = textureLoader.load(`${baseUrl}earth_atmos_2048.jpg`);
    const bumpTexture = textureLoader.load(`${baseUrl}earth_normal_2048.jpg`);
    const specularTexture = textureLoader.load(`${baseUrl}earth_specular_2048.jpg`);
    const cityLightsTexture = textureLoader.load(`${baseUrl}earth_lights_2048.png`);
    const cloudTexture = textureLoader.load(`${baseUrl}earth_clouds_1024.png`);
    const moonTexture = textureLoader.load(`${baseUrl}moon_1024.jpg`);

    const earthGroup = new THREE.Group();
    earthGroup.rotation.z = THREE.MathUtils.degToRad(23.5);
    scene.add(earthGroup);

    const earthGeometry = new THREE.SphereGeometry(1, 160, 160);
    const earthMaterial = new THREE.MeshPhongMaterial({
      map: earthTexture,
      bumpMap: bumpTexture,
      bumpScale: 0.036,
      specularMap: specularTexture,
      specular: new THREE.Color(0x6482a8),
      shininess: 30
    });
    const earth = new THREE.Mesh(earthGeometry, earthMaterial);
    earth.castShadow = true;
    earth.receiveShadow = true;
    earthGroup.add(earth);

    // Lớp ánh đèn thành phố chỉ hiện ở nửa tối khi bật Mặt Trời
    const nightLightsMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uLightsMap: { value: cityLightsTexture },
        uSunDir: { value: sunPosition.clone().normalize() }
      },
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vWorldNormal;
        void main() {
          vUv = uv;
          vWorldNormal = normalize(mat3(modelMatrix) * normal);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D uLightsMap;
        uniform vec3 uSunDir;
        varying vec2 vUv;
        varying vec3 vWorldNormal;
        void main() {
          float sunDot = dot(normalize(vWorldNormal), normalize(uSunDir));
          float nightMask = smoothstep(0.12, -0.25, sunDot);
          vec3 lights = texture2D(uLightsMap, vUv).rgb;
          vec3 warmCity = lights * vec3(1.15, 0.88, 0.45) * 1.45;
          gl_FragColor = vec4(warmCity * nightMask, nightMask);
        }
      `,
      blending: THREE.AdditiveBlending,
      transparent: true,
      depthWrite: false
    });
    const nightLightsMesh = new THREE.Mesh(new THREE.SphereGeometry(1.003, 128, 128), nightLightsMaterial);
    nightLightsMesh.visible = false;
    earth.add(nightLightsMesh);

    // Lớp mây chi tiết
    const cloudGeometry = new THREE.SphereGeometry(1.01, 160, 160);
    const cloudMaterial = new THREE.MeshPhongMaterial({
      map: cloudTexture,
      transparent: true,
      opacity: 0.8,
      depthWrite: false
    });
    const clouds = new THREE.Mesh(cloudGeometry, cloudMaterial);
    earthGroup.add(clouds);

    // Quầng khí quyển xanh lam mịn ôm sát Trái Đất
    const glowGeometry = new THREE.SphereGeometry(1.052, 64, 64);
    const glowMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uSunDir: { value: sunPosition.clone().normalize() },
        uSunActive: { value: 0.0 }
      },
      vertexShader: `
        varying vec3 vNormal;
        varying vec3 vWorldNormal;
        void main() {
          vNormal = normalize(normalMatrix * normal);
          vWorldNormal = normalize(mat3(modelMatrix) * normal);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 uSunDir;
        uniform float uSunActive;
        varying vec3 vNormal;
        varying vec3 vWorldNormal;
        void main() {
          float rim = pow(clamp(0.68 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 0.0, 1.0), 3.8);
          float sunFacing = smoothstep(-0.35, 0.85, dot(normalize(vWorldNormal), normalize(uSunDir)));
          float factor = mix(1.32, 0.15 + 1.45 * sunFacing, uSunActive);
          vec3 atmosphereColor = vec3(0.24, 0.72, 1.0);
          gl_FragColor = vec4(atmosphereColor, 1.0) * rim * factor;
        }
      `,
      side: THREE.BackSide,
      blending: THREE.AdditiveBlending,
      transparent: true,
      depthWrite: false
    });
    const glow = new THREE.Mesh(glowGeometry, glowMaterial);
    earthGroup.add(glow);

    // ================= MẶT TRĂNG (FIX LỖI VIỀN TRẮNG GẮT & ĐỒNG BỘ ÁNH SÁNG) =================
    const moonOrbitPivot = new THREE.Group();
    moonOrbitPivot.rotation.z = THREE.MathUtils.degToRad(5.14);
    moonOrbitPivot.visible = false;
    scene.add(moonOrbitPivot);

    const moonGroup = new THREE.Group();
    moonGroup.position.set(6.8, 0, 0);
    moonOrbitPivot.add(moonGroup);

    const moonGeometry = new THREE.SphereGeometry(0.273, 64, 64);
    const moonMaterial = new THREE.MeshPhongMaterial({
      map: moonTexture,
      bumpMap: moonTexture,
      bumpScale: 0.016,
      emissive: new THREE.Color(0xcbd5e1),
      emissiveMap: moonTexture,
      emissiveIntensity: 0.22,
      specular: new THREE.Color(0x111111),
      shininess: 4
    });
    const moon = new THREE.Mesh(moonGeometry, moonMaterial);
    moon.castShadow = true;
    moon.receiveShadow = true;
    moonGroup.add(moon);

    // Tán xạ ánh bạc cực mỏng ôm sát mép Mặt Trăng (không tạo vòng nhẫn trắng dày)
    const moonHalo = new THREE.Mesh(
      new THREE.SphereGeometry(0.283, 48, 48),
      new THREE.ShaderMaterial({
        uniforms: {
          uSunDir: { value: sunPosition.clone().normalize() },
          uSunActive: { value: 0.0 }
        },
        vertexShader: `
          varying vec3 vNormal;
          varying vec3 vWorldNormal;
          void main() {
            vNormal = normalize(normalMatrix * normal);
            vWorldNormal = normalize(mat3(modelMatrix) * normal);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform vec3 uSunDir;
          uniform float uSunActive;
          varying vec3 vNormal;
          varying vec3 vWorldNormal;
          void main() {
            float rim = pow(clamp(0.58 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 0.0, 1.0), 4.5);
            float sunFacing = smoothstep(-0.2, 0.85, dot(normalize(vWorldNormal), normalize(uSunDir)));
            float factor = mix(0.45, 0.05 + 0.65 * sunFacing, uSunActive);
            gl_FragColor = vec4(0.82, 0.89, 1.0, 1.0) * rim * factor;
          }
        `,
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending,
        transparent: true,
        depthWrite: false
      })
    );
    moonGroup.add(moonHalo);

    // ================= BẦU TRỜI SAO DÀY ĐẶC & LẤP LÁNH VỪA PHẢI =================
    function createStarTexture() {
      const c = document.createElement("canvas");
      c.width = 64;
      c.height = 64;
      const g = c.getContext("2d");
      const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, "rgba(255,255,255,1)");
      grad.addColorStop(0.35, "rgba(224,242,254,0.72)");
      grad.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = grad;
      g.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }

    const starsCount = 24000;
    const starsGeometry = new THREE.BufferGeometry();
    const starsPositions = new Float32Array(starsCount * 3);
    const starsColors = new Float32Array(starsCount * 3);
    const starBaseColors = [];
    const starPhases = new Float32Array(starsCount);

    const palette = [
      new THREE.Color(0xffffff),
      new THREE.Color(0xbae6fd),
      new THREE.Color(0xfef3c7),
      new THREE.Color(0xe9d5ff)
    ];

    for (let i = 0; i < starsCount; i++) {
      const i3 = i * 3;
      const radius = 85 + Math.random() * 290;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);

      starsPositions[i3] = radius * Math.sin(phi) * Math.cos(theta);
      starsPositions[i3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
      starsPositions[i3 + 2] = radius * Math.cos(phi);

      const col = palette[Math.floor(Math.random() * palette.length)].clone();
      const baseBrightness = 0.34 + Math.random() * 0.62;
      col.multiplyScalar(baseBrightness);
      starBaseColors.push(col);

      starsColors[i3] = col.r;
      starsColors[i3 + 1] = col.g;
      starsColors[i3 + 2] = col.b;

      starPhases[i] = Math.random() * Math.PI * 2;
    }

    starsGeometry.setAttribute("position", new THREE.BufferAttribute(starsPositions, 3));
    starsGeometry.setAttribute("color", new THREE.BufferAttribute(starsColors, 3));

    const starsMaterial = new THREE.PointsMaterial({
      size: 0.42,
      vertexColors: true,
      transparent: true,
      opacity: 0.9,
      map: createStarTexture(),
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const starField = new THREE.Points(starsGeometry, starsMaterial);
    scene.add(starField);

    // ================= ĐIỀU KHIỂN BẬT/TẮT MẶT TRỜI & MẶT TRĂNG =================
    let sunEnabled = false;
    let moonEnabled = false;

    const sunBtn = document.getElementById("toggle-sun");
    const moonBtn = document.getElementById("toggle-moon");
    const moonWorldPos = new THREE.Vector3();
    const camLightOffset = new THREE.Vector3();

    function updateCelestialState() {
      sunGroup.visible = sunEnabled;
      moonOrbitPivot.visible = moonEnabled;
      nightLightsMesh.visible = sunEnabled;
      glowMaterial.uniforms.uSunActive.value = sunEnabled ? 1.0 : 0.0;
      moonHalo.material.uniforms.uSunActive.value = sunEnabled ? 1.0 : 0.0;

      if (sunEnabled) {
        // Bật Mặt Trời: ánh sáng ngày/đêm thực tế từ hướng Mặt Trời
        baseAmbient.intensity = 0.07;
        cameraStudioLight.intensity = 0.0;
        sunLight.intensity = 2.75;
        moonMaterial.emissiveIntensity = 0.08;
      } else {
        // Tắt Mặt Trời (dù bật hay tắt Mặt Trăng):
        // Giữ ánh sáng studio bám theo hướng camera để bề mặt có độ bóng biển, nổi khối địa hình
        // đẹp y hệt khi bật Mặt Trời nhưng không bị chia nửa tối nửa sáng.
        baseAmbient.intensity = 0.38;
        cameraStudioLight.intensity = 1.75;
        sunLight.intensity = 0.0;
        moonMaterial.emissiveIntensity = 0.22;
      }

      // Ánh sáng bạc phản chiếu từ Mặt Trăng hắt nhẹ lên Trái Đất
      moonBounceLight.intensity = moonEnabled ? (sunEnabled ? 0.55 : 0.28) : 0;

      // Khoảng cách Mặt Trăng khi bật cùng Mặt Trời giãn hợp lý để quan sát cả hệ
      moonGroup.position.x = sunEnabled && moonEnabled ? 14.5 : 6.8;

      sunBtn.textContent = sunEnabled ? "☀️ Mặt Trời: Bật" : "☀️ Mặt Trời: Tắt";
      moonBtn.textContent = moonEnabled ? "🌙 Mặt Trăng: Bật" : "🌙 Mặt Trăng: Tắt";
      sunBtn.classList.toggle("active-sun", sunEnabled);
      moonBtn.classList.toggle("active-moon", moonEnabled);

      if (!sunEnabled && !moonEnabled) {
        camera.position.copy(earthOnlyCamPos);
      } else if (!sunEnabled && moonEnabled) {
        camera.position.copy(moonOnlyCamPos);
      } else {
        camera.position.copy(sunSystemCamPos);
      }
      controls.target.set(0, 0, 0);
      controls.update();
    }

    sunBtn.addEventListener("click", () => {
      sunEnabled = !sunEnabled;
      updateCelestialState();
    });

    moonBtn.addEventListener("click", () => {
      moonEnabled = !moonEnabled;
      updateCelestialState();
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      earth.rotation.y += 0.00024;
      clouds.rotation.y += 0.00033;

      // Khi tắt Mặt Trời, nguồn sáng studio đi cùng góc nhìn camera (lệch nhẹ lên trên phải)
      // giúp tạo điểm phản chiếu mặt biển và độ nổi địa hình đẹp ở mọi góc xoay mà không bị tối nửa cầu.
      if (!sunEnabled) {
        camLightOffset.copy(camera.position).normalize().multiplyScalar(12);
        camLightOffset.y += 3.5;
        cameraStudioLight.position.copy(camLightOffset);
      }

      if (sunEnabled) {
        sunSurfaceMaterial.uniforms.uTime.value = elapsed;
        sunCorona.material.rotation = elapsed * 0.03;
      }

      if (moonEnabled) {
        moonOrbitPivot.rotation.y += 0.0002;
        moon.rotation.y += 0.0002;
        moonGroup.getWorldPosition(moonWorldPos);
        moonBounceLight.position.copy(moonWorldPos);
      }

      // Sao lấp lánh dịu vừa phải
      const colorAttr = starsGeometry.attributes.color;
      for (let i = 0; i < starsCount; i++) {
        if (i % 5 !== 0) continue;
        const twinkle = 0.78 + 0.22 * Math.sin(elapsed * 1.3 + starPhases[i]);
        const base = starBaseColors[i];
        colorAttr.setXYZ(i, base.r * twinkle, base.g * twinkle, base.b * twinkle);
      }
      colorAttr.needsUpdate = true;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
